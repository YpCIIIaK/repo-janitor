name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repo and write nothing
# back. Without an explicit block, older repositories still get write-by-default.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Prove the engine, CLI, Action and dashboard build and pass on every
        # platform we claim to support. Node 20 is EOL (2026-04-30).
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v7

      # Pin third-party actions to a commit SHA — tags can move.
      # pnpm/action-setup reads the version from package.json "packageManager".
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Order matters and is spelled out in the script: the Action imports
      # `repo-anti-rot/context`, which only exists once the CLI's dist/ is built.
      # A glob filter silently skipped the CLI (its name is unscoped) and this
      # only ever failed on a clean checkout, where no stale dist/ was lying around.
      - name: Build packages (engine, CLI, Action)
        run: pnpm run build:packages

      # A GitHub Action runs straight from the tagged ref with no install step,
      # so packages/action/dist/index.cjs is committed. Committed build output is
      # build output that goes stale: someone edits packages/action/src, the
      # bundle is not rebuilt, and every consumer keeps running last month's code
      # while the source says otherwise. The build above has just regenerated it —
      # if that produced a different file, the commit is inconsistent with itself.
      - name: Action bundle is up to date with its source
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! git diff --quiet -- packages/action/dist/index.cjs; then
            echo "::error::packages/action/dist/index.cjs is stale. Run 'pnpm run build:packages' and commit the result."
            git diff --stat -- packages/action/dist/index.cjs
            exit 1
          fi
          echo "Action bundle matches its source."

      - name: Typecheck dashboard
        run: pnpm exec tsc --noEmit

      # Lint is platform-independent — run it once (on Linux) to save CI minutes.
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint

      - name: Test (all packages + dashboard)
        run: pnpm test

      - name: Build dashboard
        run: pnpm build

      # Scan ourselves and send the result to the dashboard, which is what keeps
      # the tokenless health badge in the README current. Linux only: three
      # platforms would ingest three reports per push and the badge would show
      # whichever finished last.
      #
      # `fail-on: never` on purpose — this repository's own grade is a thing to
      # watch, not a merge gate, and a scanner that can block its own development
      # is a scanner people delete. The push-only condition keeps it off forks and
      # pull requests, where the secret is not available anyway.
      #
      # Skipped entirely until REPO_ANTI_ROT_INGEST_TOKEN exists as a repository
      # secret. Without it the upload would be unauthenticated, and if the server
      # also has no token set then /api/ingest accepts anything — meaning anyone
      # could forge this badge. Silence is the correct behaviour for a missing
      # secret; a half-configured upload is not.
      - name: Report health to the dashboard
        if: >-
          matrix.os == 'ubuntu-latest' &&
          github.event_name == 'push' &&
          github.repository == 'YpCIIIaK/repo-janitor'
        env:
          INGEST_TOKEN: ${{ secrets.REPO_ANTI_ROT_INGEST_TOKEN }}
        # Failure is swallowed in the script rather than with `continue-on-error`,
        # and that is dogfooding rather than style: this repo's own `ci-health`
        # scanner reports a literal `continue-on-error: true` on any step that
        # runs a command, and it would be right to. Publishing a badge is not a
        # check that could have failed — it is an upload — and saying so in the
        # shell states the intent where the reader can see it, instead of hiding
        # it behind a key that also silences real checks.
        run: |
          if [ -z "$INGEST_TOKEN" ]; then
            echo "REPO_ANTI_ROT_INGEST_TOKEN is not set — skipping upload."
            exit 0
          fi
          node packages/cli/dist/index.js scan --path . --format json --output report.json || {
            echo "Self-scan failed; not uploading."
            exit 0
          }
          curl --fail --silent --show-error \
            -X POST "https://repo-anti-rot.onrender.com/api/ingest" \
            -H "Authorization: Bearer $INGEST_TOKEN" \
            -H "content-type: application/json" \
            --data-binary @report.json || echo "Upload failed; the badge keeps its last value."
